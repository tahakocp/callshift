name: release
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: build
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          mkdir dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os=${target%/*}; arch=${target#*/}
            name=callshift-$TAG-$os-$arch
            mkdir "$name"
            ext=""; [ "$os" = windows ] && ext=.exe
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=$TAG" -o "$name/callshift$ext" ./cmd/callshift
            cp LICENSE README.md "$name"/
            if [ "$os" = windows ]; then zip -qr "dist/$name.zip" "$name"; else tar czf "dist/$name.tar.gz" "$name"; fi
          done
          (cd dist && sha256sum * > SHA256SUMS)
      - name: upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/* --clobber
