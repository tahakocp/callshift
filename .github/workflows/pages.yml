name: pages
on:
  push:
    branches: [main]
    paths: ["site/**", "cmd/wasm/**", "internal/**", "testdata/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: build
        run: |
          mkdir -p public
          cp site/* public/
          cp testdata/shop-v1.yaml testdata/shop-v2.yaml public/
          cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" public/ 2>/dev/null || cp "$(go env GOROOT)/misc/wasm/wasm_exec.js" public/
          GOOS=js GOARCH=wasm go build -trimpath -ldflags "-s -w" -o public/callshift.wasm ./cmd/wasm
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
