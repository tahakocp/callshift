openapi: 3.0.3
info:
  title: Shop API
  version: "1.0"
servers:
  - url: https://api.shop.example/v1
paths:
  /orders:
    get:
      operationId: listOrders
      parameters:
        - name: page
          in: query
          schema: {type: integer}
        - name: per_page
          in: query
          schema: {type: integer}
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  orders:
                    type: array
                    items: {$ref: "#/components/schemas/Order"}
                  total_count: {type: integer}
    post:
      operationId: createOrder
      requestBody:
        content:
          application/json:
            schema: {$ref: "#/components/schemas/NewOrder"}
      responses:
        "201":
          description: created
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Order"}
  /orders/{id}:
    get:
      operationId: getOrder
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Order"}
  /orders/{id}/refund:
    post:
      operationId: refundOrder
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: ok}
  /legacy/export:
    get:
      operationId: exportAll
      responses:
        "200": {description: ok}
components:
  schemas:
    NewOrder:
      type: object
      required: [sku]
      properties:
        sku: {type: string}
        qty: {type: integer}
        shipping_speed:
          type: string
          enum: [standard, express, overnight]
        coupon:
          type: string
        notes:
          type: string
          description: Free text. Use `comment` instead.
        address:
          type: object
          properties:
            zip: {type: string}
            line1: {type: string}
    Order:
      type: object
      properties:
        id: {type: string}
        sku: {type: string}
        legacy_status_code: {type: integer}
        tracking_url: {type: string}
